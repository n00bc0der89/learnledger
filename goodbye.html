<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LearnLedger removed</title>
<link rel="icon" href="assets/favicon.png">
<style>
:root{--bg:#f6f8fc;--card:#fff;--ink:#0f2447;--ink2:#44557a;--rule:#dfe6f1;--brand:#1c5cab}
@media (prefers-color-scheme:dark){:root{--bg:#0b1424;--card:#111d33;--ink:#eef3fb;--ink2:#b4c1d9;--rule:#22314d;--brand:#5b9bea}}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:560px;margin:0 auto;padding:56px 20px;display:grid;gap:18px}
h1{margin:0;font-size:32px;line-height:1.1}
p{margin:0;color:var(--ink2)}
.reasons{display:grid;gap:8px}
.reasons a{display:block;padding:12px 16px;border:1px solid var(--rule);border-radius:12px;background:var(--card);color:var(--ink);text-decoration:none;font-weight:600}
.reasons a:hover{border-color:var(--brand)}
</style>
</head>
<body>
<main>
  <h1>LearnLedger has been removed</h1>
  <p>Your study data was stored only in your browser, so it has now been deleted. Could you tell us why you removed it? One click opens a short email; nothing is sent automatically.</p>
  <div class="reasons" id="reasons"></div>
  <p>Changed your mind? <a href="index.html">Reinstall LearnLedger</a>.</p>
</main>
<script>
  const EMAIL = ''; // set your support address, e.g. hello@yourdomain
  const reasons = ["It didn't track my study correctly", 'Topic suggestions were wrong', 'Recall checks took too long', 'I was worried about privacy', 'I only study on my phone', 'Something else'];
  document.getElementById('reasons').innerHTML = reasons.map((r) =>
    `<a href="mailto:${EMAIL}?subject=${encodeURIComponent('LearnLedger uninstall: ' + r)}&body=${encodeURIComponent('Anything else we should know?\n\n')}">${r}</a>`).join('');
</script>
</body>
</html>
